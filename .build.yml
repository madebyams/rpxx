image: debian/stable
packages:
  - build-essential
  - cmake
  - git
  - gcc-arm-none-eabi
  - libnewlib-arm-none-eabi
sources:
  - https://git.sr.ht/~itsams_wav/rpxx
environment:
  PICO_SDK_FETCH_FROM_GIT: "on"
tasks:
  - build: |
      cd rpxx
      for project in HC-SR04 SSD1306 ST7789; do
        cmake -S "$project" -B "$project/build"
        cmake --build "$project/build" --parallel
      done
