image: ghcr.io/anothersimplecoder/cmake:latest

stages:
  - build

variables:
  PICO_SDK_FETCH_FROM_GIT: on

hc-sr04:
  stage: build
  tags:
    - amd64
  script:
    - |
      cd HC-SR04
      mkdir build
      cd build
      cmake ..
      cmake --build .

